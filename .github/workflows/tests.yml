name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # 러너의 콘솔 기본 인코딩이 cp1252 라서, 빌드 스크립트가 한글을 출력하면
  # UnicodeEncodeError 로 죽는다. UTF-8 로 고정한다.
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  test:
    # MyZIP 은 Windows 셸 통합이 핵심이라 Windows 에서만 의미가 있다.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: RAR/7Z 엔진 준비
        # 없으면 7-Zip 테스트는 스스로 건너뛴다.
        continue-on-error: true
        working-directory: .
        run: python tools/fetch_7zip.py

      - name: 서식 검사
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: 테스트
        run: cargo test --locked

  build:
    # 배포 폴더를 만들고, 그 안의 exe 로 압축·검사·풀기를 한 번 돌려 본다.
    runs-on: windows-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 빌드와 동작 확인
        run: python build.py

      - name: 산출물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: MyZIP-portable
          path: dist/MyZIP/
          retention-days: 14
