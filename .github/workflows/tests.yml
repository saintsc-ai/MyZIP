name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # 러너의 콘솔 기본 인코딩이 cp1252 라서, 한글을 출력하면
  # UnicodeEncodeError 로 스크립트가 죽는다. UTF-8 로 고정한다.
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  test:
    # MyZIP 은 Windows 셸 통합이 핵심이라 Windows 에서만 의미가 있다.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 아이콘 생성
        run: |
          python tools/make_icons.py
          python tools/make_action_icons.py

      - name: RAR/7Z 엔진 준비
        # 엔진이 없어도 ZIP/TAR 테스트는 돌아야 하므로 실패해도 계속 진행한다.
        continue-on-error: true
        run: python tools/fetch_7zip.py

      - name: 코어 테스트
        run: python tests/test_core.py

      - name: RAR / 7Z 테스트
        run: python tests/test_rar.py

      - name: 명령줄 테스트
        # 컨텍스트 메뉴 등록을 실제로 쓰고 지우므로 러너에서만 돌린다.
        env:
          MYZIP_NO_SHELL: "1"
        run: python tests/test_cli.py

  build:
    runs-on: windows-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: 빌드
        run: python build.py

      # --register 가 러너에서 멈추는 원인을 좁히기 위한 진단.
      # windowed 로 빌드한 exe 는 처리되지 않은 예외가 나면 모달 대화상자를
      # 띄우고 아무도 누르지 않아 영원히 기다린다. 창이 떠 있는지 확인한다.
      - name: register 진단
        continue-on-error: true
        run: |
          $p = Start-Process -FilePath dist\MyZIP\MyZIP.exe -ArgumentList '--register' `
                 -PassThru -RedirectStandardOutput reg-out.txt -RedirectStandardError reg-err.txt
          if (-not $p.WaitForExit(30000)) {
            Write-Host "== 30초 안에 끝나지 않음 =="
            Write-Host "-- 창을 가진 프로세스 --"
            Get-Process | Where-Object { $_.MainWindowTitle } |
              Select-Object Name, MainWindowTitle | Format-Table -AutoSize | Out-String | Write-Host
            Write-Host "-- MyZIP 프로세스 --"
            Get-Process MyZIP -ErrorAction SilentlyContinue |
              Select-Object Id, Threads.Count | Format-Table | Out-String | Write-Host
            $p.Kill()
          } else {
            Write-Host "정상 종료. exit=$($p.ExitCode)"
          }
          Write-Host "-- stdout --"; Get-Content reg-out.txt -ErrorAction SilentlyContinue | Write-Host
          Write-Host "-- stderr --"; Get-Content reg-err.txt -ErrorAction SilentlyContinue | Write-Host

      - name: 빌드된 exe 검증
        env:
          MYZIP_NO_SHELL: "1"
        run: python tests/test_built_exe.py

      - name: 산출물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: MyZIP-portable
          path: dist/MyZIP/
          retention-days: 14
