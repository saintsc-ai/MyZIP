name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # 러너의 콘솔 기본 인코딩이 cp1252 라서, 한글을 출력하면
  # UnicodeEncodeError 로 스크립트가 죽는다. UTF-8 로 고정한다.
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  test:
    # MyZIP 은 Windows 셸 통합이 핵심이라 Windows 에서만 의미가 있다.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 아이콘 생성
        run: |
          python tools/make_icons.py
          python tools/make_action_icons.py

      - name: RAR/7Z 엔진 준비
        # 엔진이 없어도 ZIP/TAR 테스트는 돌아야 하므로 실패해도 계속 진행한다.
        continue-on-error: true
        run: python tools/fetch_7zip.py

      - name: 코어 테스트
        run: python tests/test_core.py

      - name: RAR / 7Z 테스트
        run: python tests/test_rar.py

      - name: 명령줄 테스트
        # 컨텍스트 메뉴 등록을 실제로 쓰고 지우므로 러너에서만 돌린다.
        env:
          MYZIP_NO_SHELL: "1"
        run: python tests/test_cli.py

  rust:
    # Rust 재작성판 (rust/). Python 판과 따로 돌아간다.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: RAR/7Z 엔진 준비
        # 없으면 7-Zip 테스트는 스스로 건너뛴다.
        continue-on-error: true
        working-directory: .
        run: python tools/fetch_7zip.py

      - name: 서식 검사
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: 테스트
        run: cargo test

  build:
    runs-on: windows-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: 빌드
        run: python build.py

      - name: 빌드된 exe 검증
        env:
          MYZIP_NO_SHELL: "1"
        run: python tests/test_built_exe.py

      - name: 산출물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: MyZIP-portable
          path: dist/MyZIP/
          retention-days: 14
