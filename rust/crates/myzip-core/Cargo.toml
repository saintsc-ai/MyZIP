[package]
name = "myzip-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MyZIP 압축 엔진: ZIP/TAR 읽기·쓰기, 7-Zip 을 통한 RAR/7Z 해제"

[dependencies]
bzip2 = "0.6.1"
chrono = "0.4.45"
dunce = "1.0.5"
encoding_rs = "0.8.44"
filetime = "0.2.29"
flate2 = "1.1.11"
liblzma = "0.4.9"
tar = "0.4.46"
thiserror = "2.0.21"
unicode-general-category = "1.1.0"
walkdir = "2.5.0"
zip = { version = "9.4.2", default-features = false, features = ["deflate", "aes-crypto", "time"] }

[target."cfg(windows)".dependencies]
winreg = "0.56.0"

[dev-dependencies]
tempfile = "3.27.0"
